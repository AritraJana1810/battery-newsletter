name: Weekly Research Digest

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify secrets are present
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "ERROR: OPENAI_API_KEY is missing"; exit 1; fi
          if [ -z "$GMAIL_ADDRESS" ]; then echo "ERROR: GMAIL_ADDRESS is missing"; exit 1; fi
          if [ -z "$GMAIL_APP_PASSWORD" ]; then echo "ERROR: GMAIL_APP_PASSWORD is missing"; exit 1; fi
          if [ -z "$RECIPIENT_EMAIL" ]; then echo "ERROR: RECIPIENT_EMAIL is missing"; exit 1; fi
          echo "All secrets present."
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      - name: Run newsletter bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/newsletter.py
